# egress.yaml — 机器可读的数据外发清单（唯一事实源）
#
# 本文件如实列出 Tokenhush 会向厂商（vendor）发起的请求类别。它是单一事实源：
# cmd/egress-gen 读取本文件，确定性地生成以下四类产物，三处口径不会漂移：
#   1. 核心 CLI `tokenhush privacy` 的输出（internal/cli/egress_generated.go）；
#   2. 核心文档片段（docs/generated/network-egress.md）；
#   3. Pro 文档片段（tokenhush-pro/docs/engineering/08-network-egress.md）；
#   4. 官网数据片段（tokenhush-pro/web/src/data/egress.generated.json）。
#
# 边界（硬不变量）：
#   - 仅有两个外发类别：更新检查（update-check）与规则同步（rule-sync）。
#     update-check 的签名撤销文档与根签名 key-list 属于同一类别（同 host、同
#     开关），不构成第三项。
#   - 生成器会拒绝任何未在此集合内的 id，也拒绝重复 id；新增第三项外发必须先
#     修改既定的外发披露决策，而不是直接改本文件。
#   - status: active 表示该外发在当前构建中已生效；planned 表示已披露但尚未
#     实现。rule-sync 已由 `tokenhush rules sync` 落地，故为 active；update-check
#     的命令行自更新分支与联网检查（根签名 key-list → 更新密钥 → 更新清单）也已
#     接线到 `tokenhush update`（含 --check，仅 self-managed），故为 active。
#     真实签名内容（manifest / revocations / key-list）的发布属 owner 离线仪式，
#     未发布时读取面返回 404，但外发类别本身已生效；不得把未实现能力写成现有行为。
#   - 本文件位于公开核心仓库，正文不得引用私有仓库路径或私有决策编号。

version: 1
updated: "2026-09-14"

items:
  - id: update-check
    status: active
    host: updates.tokenhush.com
    title:
      en: Update check
      zh: 更新检查
    purpose:
      en: >-
        Check for a signed release: the update manifest, its signed revocation
        document, and the root-signed key-list. These share one host and one
        switch and are one egress category, not three.
      zh: >-
        检查已签名的版本更新：更新清单、其签名撤销文档，以及根签名 key-list。
        三者共用同一 host 与同一开关，属同一外发类别，而非三项。
    fields:
      - name: channel
        kind: sent
        description:
          en: Release channel requested (for example stable or beta).
          zh: 请求的发布通道（例如 stable 或 beta）。
      - name: os_arch
        kind: sent
        description:
          en: Operating system and CPU architecture of the running binary.
          zh: 运行中二进制的操作系统与 CPU 架构。
      - name: current_version
        kind: sent
        description:
          en: Current binary version, so the server can tell whether an update exists.
          zh: 当前二进制版本号，供服务端判断是否存在可用更新。
      - name: ip
        kind: observed
        description:
          en: Source IP address of the request, visible to the server.
          zh: 请求的来源 IP 地址，服务端可见。
      - name: timestamp
        kind: observed
        description:
          en: Request time recorded by the server.
          zh: 服务端记录的请求时间戳。
      - name: access_logs
        kind: observed
        description:
          en: Cloudflare access logs (path, time, source IP, User-Agent).
          zh: Cloudflare 访问日志（路径、时间、来源 IP、User-Agent）。
    switch:
      en: >-
        The check runs only when you run `tokenhush update` (including `--check`)
        on a self-managed install; Homebrew and Scoop installs are handed to
        their package manager. Set the environment variable
        `TOKENHUSH_NO_UPDATE_CHECK=1` to make the command return before any
        network request.
      zh: >-
        更新检查只在 self-managed 安装上运行 `tokenhush update`（含 `--check`）时
        发生；Homebrew 与 Scoop 安装交由各自的包管理器处理。设置环境变量
        `TOKENHUSH_NO_UPDATE_CHECK=1` 可使该命令在发起任何网络请求前直接返回。
    default: enabled
    retention:
      en: Cloudflare access logs and request records are retained for 30 days.
      zh: Cloudflare 访问日志与请求记录保留 30 天。

  - id: rule-sync
    status: active
    host: updates.tokenhush.com
    title:
      en: Rule sync
      zh: 规则同步
    purpose:
      en: >-
        Fetch signed detection-rule manifests and rule bundles so the local
        detectors can be tightened without shipping a new binary.
      zh: >-
        获取已签名的检测规则清单与规则包，使本地检测器可增量收紧，
        无需重新分发二进制。
    fields:
      - name: channel
        kind: sent
        description:
          en: Rule channel requested (for example stable or beta).
          zh: 请求的规则通道（例如 stable 或 beta）。
      - name: os_arch
        kind: sent
        description:
          en: Operating system and CPU architecture of the running binary.
          zh: 运行中二进制的操作系统与 CPU 架构。
      - name: current_schema_version
        kind: sent
        description:
          en: Schema version and serial of the rule set currently in use.
          zh: 当前所用规则包的 schema 版本与 serial。
      - name: ip
        kind: observed
        description:
          en: Source IP address of the request, visible to the server.
          zh: 请求的来源 IP 地址，服务端可见。
      - name: timestamp
        kind: observed
        description:
          en: Request time recorded by the server.
          zh: 服务端记录的请求时间戳。
      - name: access_logs
        kind: observed
        description:
          en: Cloudflare access logs (path, time, source IP, User-Agent).
          zh: Cloudflare 访问日志（路径、时间、来源 IP、User-Agent）。
    switch:
      en: >-
        Rule sync runs only when you run `tokenhush rules sync`; it never syncs
        on its own. Set the environment variable `TOKENHUSH_NO_RULE_SYNC=1` to
        make the command refuse without any network request.
      zh: >-
        规则同步只在你运行 `tokenhush rules sync` 时发生，绝不自动同步。
        设置环境变量 `TOKENHUSH_NO_RULE_SYNC=1` 可使该命令拒绝同步且不发起任何网络请求。
    default: enabled
    retention:
      en: Cloudflare access logs and request records are retained for 30 days.
      zh: Cloudflare 访问日志与请求记录保留 30 天。
