# GoReleaser v2 configuration for the public Tokenhush core.
#
# Distribution (docs/deployment.md): macOS via the Homebrew cask, Windows via
# install.ps1 (Scoop as an alternative), Linux via the install.sh script, plus
# the raw archives attached to the GitHub release. Release is tag-triggered in
# .github/workflows/release.yml. Local dry render:
# `goreleaser release --snapshot --clean`. SBOMs need `syft` on PATH.
version: 2

project_name: tokenhush

builds:
  - id: tokenhush
    main: ./cmd/tokenhush
    binary: tokenhush
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/fregie/tokenhush/internal/cli.commit={{ .Commit }}
      - -X github.com/fregie/tokenhush/internal/cli.date={{ .CommitDate }}
      - -X github.com/fregie/tokenhush/pkg/supply.Version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - arm64
      - amd64

archives:
  - id: tokenhush
    # Keep this template stable: install.sh and install.ps1 derive the archive
    # name from the OS and architecture they detect.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# One SBOM per archive, generated with syft and attached to the release next to
# the archives.
sboms:
  - id: archive
    artifacts: archive
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]
    documents:
      - "{{ .ArtifactName }}.sbom.json"

# macOS channel. The cask installs the darwin binary from the GitHub release.
# `skip_upload: auto` keeps snapshot and prerelease runs from touching the tap;
# a real release is pushed with HOMEBREW_TAP_GITHUB_TOKEN (release.yml).
homebrew_casks:
  - name: tokenhush
    binaries:
      - tokenhush
    repository:
      owner: fregie
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/fregie/tokenhush"
    description: "Local gateway that redacts secrets before they reach AI models"
    caveats: |
      tokenhush is not notarized yet. If macOS blocks the first run, clear the
      quarantine attribute:
        xattr -dr com.apple.quarantine "$(which tokenhush)"
    skip_upload: auto

# Windows alternative channel: install.ps1 is the primary path, Scoop is the
# alternative. The manifest lands in the root of the bucket repo.
scoops:
  - name: tokenhush
    repository:
      owner: fregie
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: "https://github.com/fregie/tokenhush"
    description: "Local gateway that redacts secrets before they reach AI models"
    license: Apache-2.0
    skip_upload: auto

release:
  github:
    owner: fregie
    name: tokenhush
  draft: false
  prerelease: auto
  footer: |
    ---

    Install: `brew install --cask fregie/tap/tokenhush` (macOS),
    `irm https://raw.githubusercontent.com/fregie/tokenhush/main/install.ps1 | iex`
    (Windows, or `scoop install tokenhush`), or the `install.sh` script (Linux).

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
