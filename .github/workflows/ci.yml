name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build, vet, test, lint, layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Lint
        uses: golangci/golangci-lint-action@v6

      - name: Layering guard
        run: bash scripts/check-layering.sh

      # Green mode (W0.5): every step above stays green-mode and never exports
      # the full-graph switch. The dedicated step below is the W6.6 final
      # gate: every package, edge and artifact now exists, so the guards and
      # the layering suite run with full-graph strictness. Exactly one step
      # exports the switch, and the CI config guard enforces that.
      - name: Guards and layering (full graph)
        run: TOKENHUSH_GUARD_FULL_GRAPH=1 go test ./internal/guards/... ./internal/layering/... -count=1

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans with the repository ruleset in .gitleaks.toml.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cross-build:
    name: cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Effective target set - exactly these three CGO-free ports:
      #   CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...
      #   CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
      #   CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
      - name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
