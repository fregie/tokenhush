name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# CGO-free builds are a project goal (docs/13 §10.1); keep it disabled on every
# runner. A workflow-level env is used instead of inline `CGO_ENABLED=0 <cmd>`
# because the Windows runner defaults to PowerShell, where `VAR=value cmd` is
# not valid syntax.
env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `shell: bash` makes the gate identical on all runners (PowerShell has
      # no `test` builtin). Fails if any file is not gofmt-formatted.
      - name: Check formatting (gofmt)
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build (CGO_ENABLED=0)
        run: go build ./...
