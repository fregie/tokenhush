name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# CGO-free builds are a project goal (docs/13 §10.1); keep it disabled on every
# runner. A workflow-level env is used instead of inline `CGO_ENABLED=0 <cmd>`
# because the Windows runner defaults to PowerShell, where `VAR=value cmd` is
# not valid syntax.
env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `shell: bash` makes the gate identical on all runners (PowerShell has
      # no `test` builtin). Fails if any file is not gofmt-formatted.
      - name: Check formatting (gofmt)
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build (CGO_ENABLED=0)
        run: go build ./...

  # Supply-chain gates (security.md §6, docs/13 §12): permissive-license
  # allowlist (no GPL/AGPL), secret scan, SPDX SBOM artifact, and a tidy-module
  # check. Runs once on ubuntu-latest; the three-OS matrix above is unaffected.
  # All tool versions are pinned for reproducibility.
  supply-chain:
    name: supply-chain (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full commit history

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Module hygiene (go mod tidy)
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          # Catch a modified go.mod and a newly created go.sum alike. The module
          # currently has zero dependencies, so go.sum legitimately may not
          # exist yet; `git status` handles an absent file correctly.
          status="$(git status --porcelain -- go.mod go.sum)"
          if [ -n "$status" ]; then
            echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"
            echo "$status"
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi
          echo "module is tidy (go.sum present: $(test -e go.sum && echo yes || echo no))"

      - name: License allowlist gate (go-licenses v1.6.0)
        shell: bash
        run: |
          set -euo pipefail
          # Only MIT / Apache-2.0 / BSD-2-Clause / BSD-3-Clause pass (docs/13 §12).
          go install github.com/google/go-licenses@v1.6.0
          go version -m "$(go env GOPATH)/bin/go-licenses" | sed -n '1,3p'
          "$(go env GOPATH)/bin/go-licenses" check ./... \
            --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause

      - name: Secret scan (gitleaks v8.30.1)
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSfL "${base}/${tarball}" -o "/tmp/${tarball}"
          curl -sSfL "${base}/gitleaks_${version}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          ( cd /tmp && grep " ${tarball}\$" gitleaks_checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1

      - name: Install syft (v1.51.1)
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.51.1

      - name: Generate SPDX SBOM
        run: syft dir:. -o spdx-json=sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json
          if-no-files-found: error
