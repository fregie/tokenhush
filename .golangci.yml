# Error-swallowing and nil-safety checks required by the plan.
# `unused` keeps the dead-export surface honest for production code; it is
# excluded from _test.go files because guard and invariant tests deliberately
# keep fixture helpers whose only readers are other test files.
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck      # error-swallowing
    - govet         # correctness / nil safety
    - staticcheck   # correctness / nil safety
    - ineffassign
    - nilnil
    - errorlint
    - unused        # dead production code, including unreferenced exports

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - unused
  max-issues-per-linter: 0
  max-same-issues: 0
