# Extends the built-in rule set; only planted fake secrets under testdata/ and
# the exact fake literals asserted by tests are exempt. Everything else keeps
# the full default detection rules.
[extend]
useDefault = true

# Custom rule: Cloudflare API tokens carry the `cfat_` prefix, which the
# built-in rule set does not match (that is how the 2026-09 leaked token
# slipped past the history scan). No path allowlist on purpose: this rule must
# fire in every file, including untracked and .gitignore'd working-tree files
# (see scripts/check-secrets.sh).
[[rules]]
id = "tokenhush-cloudflare-api-token"
description = "Cloudflare API token (cfat_ prefix)"
regex = '''cfat_[A-Za-z0-9_-]{20,}'''
keywords = [
  "cfat_",
]

[[allowlists]]
description = "Planted fake secrets in test fixtures (not real credentials)"
paths = [
  '''(^|/)testdata/''',
]

[[allowlists]]
description = "Planted fake key literal asserted by walk_test.go (not a real credential)"
regexTarget = "secret"
regexes = [
  '''^sk-test-FAKE_LEAF_[0-9]{3}$''',
]

[[allowlists]]
description = "Tokenhush PII placeholders are non-secret by construction (docs/architecture.md)"
regexTarget = "secret"
regexes = [
  '''^__PII_[a-z][a-z0-9_]*_[0-9a-f]{8,}__$''',
]

[[allowlists]]
description = "Synthetic README doc example OPENAI_API_KEY=sk-proj-abc123 (not a real credential)"
regexTarget = "secret"
regexes = [
  '''^sk-proj-abc123$''',
]

[[allowlists]]
description = "Synthetic placeholder-grammar fixtures used by pkg/gateway/placeholder_test.go (not real credentials), scoped by grammar only so arbitrary secrets in that file are still reported"
regexTarget = "secret"
regexes = [
  '''^_?([A-Za-z][A-Za-z0-9_-]*_?)?[0-9A-Fa-f]{16}$''',
]
